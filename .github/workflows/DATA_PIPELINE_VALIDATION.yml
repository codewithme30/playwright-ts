name: data-pipeline-validation

on: [push, pull_request]

jobs:
  test:
    name: data-pipeline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docker version
        run: |
          docker --version
          docker compose version
          docker info
          docker ps

      - name: checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: tests
        run: |
          npm install

      - name: Execute Tests
        working-directory: tests
        run: |
          npm test    

      - name: Upload target_1 events log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target_1_events_log
          path: app_t1/events.log
          if-no-files-found: ignore

      - name: Upload target_2 events log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target_2_events_log
          path: app_t2/events.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report

  sample-tests:
    name: sample-web-api-database-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Execute sample tests
        working-directory: tests
        run: |
          npm run test:samples

      - name: Upload sample Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-samples
          path: tests/playwright-report-samples