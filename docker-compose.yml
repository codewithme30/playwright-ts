
services:
  target_1:
    build: .
    container_name: target_1
    working_dir: /app
    volumes:
      - "./app_t1:/app"
    command: ["/bin/sh", "-c", "node app.js target > target_1.log 2>&1"]

  target_2:
    build: .
    container_name: target_2
    working_dir: /app
    volumes:
      - "./app_t2:/app"
    command: ["node", "app.js", "target"]

  target_3:
    build: .
    container_name: target_3
    working_dir: /app
    volumes:
      - "./app_t3:/app"
    command: ["node", "app.js", "target"]

  splitter:
    build: .
    container_name: splitter
    working_dir: /app
    volumes:
      - "./app:/app"
    command: ["node", "app.js", "splitter"]
    depends_on:
      - target_1
      - target_2
      - target_3

  agent:
    build: .
    container_name: agent
    working_dir: /app
    volumes:
      - "./app:/app"
    command: ["node", "app.js", "agent"]
    depends_on:
      - splitter